name: Publish npm stable release

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type publish-0.2.1-stable
        required: true
        type: string
      resume_existing:
        description: Resume after a partial publish by verifying and skipping existing 0.2.1 packages
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'publish-0.2.1-stable'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Enable pinned pnpm and provenance-capable npm
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate && npm install --global npm@11.5.1
      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile
      - name: Build the pinned SQLite native dependency
        run: pnpm deps:native
      - name: Verify source and tests
        run: pnpm verify
      - name: Build and inspect immutable tarballs
        run: pnpm pack:release
      - name: Publish six stable packages with npm provenance
        run: node scripts/publish-release.mjs
        env:
          RELEASE_CONFIRM: ${{ inputs.confirmation }}
          RESUME_EXISTING: ${{ inputs.resume_existing }}
