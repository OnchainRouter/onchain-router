name: Verify public clients

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate
      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile
      - name: Build the pinned SQLite native dependency
        run: pnpm deps:native
      - name: Verify source, tests, and package metadata
        run: pnpm verify
      - name: Build and inspect stable npm tarballs
        run: pnpm pack:release
