[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onchain-router"
version = "0.1.0"
description = "Python SDK for Onchain Router discovery, x402 payments, recovery, and receipts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AgenticFI" }]
keywords = ["x402", "USDC", "agents", "LLM", "Base"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://onchainrouter.dev/docs/sdk"
Repository = "https://github.com/AgenticFI/onchain-router-clients"
Issues = "https://github.com/AgenticFI/onchain-router-clients/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
